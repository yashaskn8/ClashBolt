name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '22 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clashbolt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Start native PostgreSQL for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER clashbolt WITH PASSWORD 'clashbolt'"
          sudo -u postgres psql -c "CREATE DATABASE clashbolt_test OWNER clashbolt"
          echo 'CLASHBOLT_TEST_DATABASE_URL=postgresql://clashbolt:clashbolt@127.0.0.1:5432/clashbolt_test' >> "$GITHUB_ENV"
      - name: Start independent native target PostgreSQL cluster
        run: |
          VERSION="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          sudo pg_createcluster "$VERSION" clashbolt_target -p 5433 --start
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'ci-target-only'"
          echo 'CLASHBOLT_TEST_TARGET_ADMIN_URL=postgresql://postgres:ci-target-only@127.0.0.1:5433/postgres' >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[dev]'
      - name: Verify installed Python dependencies
        run: python -m pip check
      - name: Check Python syntax and imports
        run: |
          python -m compileall -q backend/clashbolt
          python -m ruff check --select I --diff .
          python -m ruff check .
      - name: Reject high-confidence unreachable or unused Python code
        run: vulture backend/clashbolt --min-confidence 100
      - name: Strict PostgreSQL integration tests and branch coverage
        run: python -m pytest -q --timeout=120 --durations=10 --cov=clashbolt --cov-branch --cov-report=term-missing --cov-fail-under=75
      - name: Force crash/restart of disposable control PostgreSQL and verify recovery
        run: |
          set -euo pipefail
          EVIDENCE="$(mktemp)"
          trap 'rm -f "$EVIDENCE"' EXIT
          python ci/check-control-crash-recovery.py prepare "$EVIDENCE"
          VERSION="$(pg_lsclusters -h | awk '$2 == "main" { print $1; exit }')"
          test -n "$VERSION"
          sudo pg_ctlcluster -m immediate "$VERSION" main stop
          sudo pg_ctlcluster "$VERSION" main start
          pg_isready -h 127.0.0.1 -p 5432
          python ci/check-control-crash-recovery.py verify "$EVIDENCE"
      - name: Verify deployed fixture isolation on the native host
        run: bash ci/check-target-service.sh
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build frontend assets for same-origin deployment smoke test
        run: npm run build
        working-directory: frontend
      - name: Verify same-origin static deployment in Chromium
        run: CLASHBOLT_BROWSER_MODE=static npm run test:e2e
        working-directory: frontend
      - name: Initialize native PostgreSQL for role-based browser coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER clashbolt WITH PASSWORD 'clashbolt'"
          sudo -u postgres psql -c "CREATE DATABASE clashbolt_browser OWNER clashbolt"
          VERSION="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          sudo pg_createcluster "$VERSION" clashbolt_browser_target -p 5433 --start
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'ci-target-only'"
          export CLASHBOLT_DATABASE_URL='postgresql://clashbolt:clashbolt@127.0.0.1:5432/clashbolt_browser'
          export CLASHBOLT_ACCESS_MODE=accounts
          export CLASHBOLT_SESSION_SECRET='ci-only-signed-session-secret-32-chars-123'
          python -m clashbolt.accounts migrate
          python - <<'PY'
          import os
          from clashbolt.accounts import AccountStore
          store = AccountStore(os.environ['CLASHBOLT_DATABASE_URL'])
          for username, role in (
              ('browser.operator', 'operator'),
              ('browser.second', 'operator'),
              ('browser.reviewer', 'reviewer'),
              ('browser.viewer', 'viewer'),
              ('browser.rolesync', 'operator'),
          ):
              store.create_account(username, role, 'browser-local-password-000')
          store.create_project('browser-workspace')
          store.grant_project_role('browser.operator', 'operator', 'browser-workspace')
          store.grant_project_role('browser.reviewer', 'reviewer', 'browser-workspace')
          store.grant_project_role('browser.viewer', 'viewer', 'browser-workspace')
          PY
          echo "CLASHBOLT_DATABASE_URL=$CLASHBOLT_DATABASE_URL" >> "$GITHUB_ENV"
          echo "CLASHBOLT_ACCESS_MODE=$CLASHBOLT_ACCESS_MODE" >> "$GITHUB_ENV"
          echo "CLASHBOLT_SESSION_SECRET=$CLASHBOLT_SESSION_SECRET" >> "$GITHUB_ENV"
          echo "CLASHBOLT_TARGET_CLUSTER_URL=postgresql://127.0.0.1:5433/postgres" >> "$GITHUB_ENV"
      - name: Start separate native worker
        run: |
          CLASHBOLT_TARGET_ADMIN_URL='postgresql://postgres:ci-target-only@127.0.0.1:5433/postgres' \
          nohup python -m clashbolt.worker --interval 0.1 \
            > /tmp/clashbolt-browser-worker.log 2>&1 &
      - name: Verify named roles and durable execution in Chromium
        working-directory: frontend
        run: |
          set -euo pipefail
          # Browser test accounts share a single CI loopback peer. Keep each
          # independent group below the production 20-login/minute throttle.
          # Backend tests verify the throttle is enforced, never disabled.
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/diagnostics.accounts.spec.ts \
            e2e/drafts.accounts.spec.ts \
            e2e/monotonic.accounts.spec.ts \
            e2e/projects.accounts.spec.ts
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["CLASHBOLT_DATABASE_URL"]) as conn:
              conn.execute("TRUNCATE account_login_throttle")
          PY
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/roles.accounts.spec.ts \
            e2e/rolesync.accounts.spec.ts \
            e2e/sse.accounts.spec.ts
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["CLASHBOLT_DATABASE_URL"]) as conn:
              conn.execute("TRUNCATE account_login_throttle")
          PY
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/reviews.accounts.spec.ts
      - name: Diagnose native worker if account browser verification fails
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          status = subprocess.run(
              ["pgrep", "-f", "^python -m clashbolt.worker --interval"],
              capture_output=True, text=True, check=False,
          )
          print("Worker process alive:", status.returncode == 0)
          logfile = Path("/tmp/clashbolt-browser-worker.log")
          if not logfile.is_file():
              print("No worker log file exists")
          else:
              # Only failure context, never print connection strings or tokens.
              lines = logfile.read_text(errors="replace").splitlines()
              for line in lines[-60:]:
                  clean = re.sub(r"postgres(?:ql)?://[^\\s]+", "[database-url]", line)
                  clean = re.sub(r"password=[^\\s]+", "password=[redacted]", clean)
                  print(clean[:500])
          PY


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Resolve and audit Python runtime and test dependencies
        run: |
          python -m pip install -e '.[dev]' 'pip-audit>=2,<3'
          python -m pip check
          # Freeze the exact installed registry packages, including transitives.
          # The unpublished local editable ClashBolt distribution is not on PyPI.
          python -m pip freeze --exclude-editable > /tmp/clashbolt-pip-freeze.txt
          python -m pip_audit --strict --no-deps -r /tmp/clashbolt-pip-freeze.txt
      - name: Audit frontend runtime and build dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [backend, frontend, browser, security]
    steps:
      - name: Require every quality, security, native-host, and browser job
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$BACKEND" "$FRONTEND" "$BROWSER" "$SECURITY"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::ClashBolt release blocked: a required CI job returned $result"
              exit 1
            fi
          done
          echo "All required CI jobs passed for this commit."
