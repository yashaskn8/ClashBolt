name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '22 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clashbolt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Start native PostgreSQL for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER clashbolt WITH PASSWORD 'clashbolt'"
          sudo -u postgres psql -c "CREATE DATABASE clashbolt_test OWNER clashbolt"
          echo 'CLASHBOLT_TEST_DATABASE_URL=postgresql://clashbolt:clashbolt@127.0.0.1:5432/clashbolt_test' >> "$GITHUB_ENV"
      - name: Start independent native target PostgreSQL cluster
        run: |
          VERSION="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          sudo pg_createcluster "$VERSION" clashbolt_target -p 5433 --start
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'ci-target-only'"
          echo 'CLASHBOLT_TEST_TARGET_ADMIN_URL=postgresql://postgres:ci-target-only@127.0.0.1:5433/postgres' >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[dev]'
      - name: Verify installed Python dependencies
        run: python -m pip check
      - name: Check Python syntax and imports
        run: |
          python -m compileall -q backend/clashbolt
          python -m ruff check .
      - name: Reject high-confidence unreachable or unused Python code
        run: vulture backend/clashbolt --min-confidence 100
      - name: Strict PostgreSQL integration tests and branch coverage
        run: |
          python -m pytest -q --timeout=120 --durations=10 \
            --junitxml=/tmp/clashbolt-junit.xml \
            --cov=clashbolt --cov-branch --cov-report=term-missing \
            --cov-report=json:/tmp/clashbolt-coverage.json --cov-fail-under=82
      - name: Reject unapproved skips and source or decision-branch coverage regressions
        run: python ci/check_quality_report.py /tmp/clashbolt-junit.xml /tmp/clashbolt-coverage.json
      - name: Force crash/restart of disposable control PostgreSQL and verify recovery
        run: |
          set -euo pipefail
          EVIDENCE="$(mktemp)"
          trap 'rm -f "$EVIDENCE"' EXIT
          python ci/check-control-crash-recovery.py prepare "$EVIDENCE"
          VERSION="$(pg_lsclusters -h | awk '$2 == "main" { print $1; exit }')"
          test -n "$VERSION"
          sudo pg_ctlcluster -m immediate "$VERSION" main stop
          sudo pg_ctlcluster "$VERSION" main start
          pg_isready -h 127.0.0.1 -p 5432
          python ci/check-control-crash-recovery.py verify "$EVIDENCE"
      - name: Verify deployed fixture isolation on the native host
        run: bash ci/check-target-service.sh
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build frontend assets for same-origin deployment smoke test
        run: npm run build
        working-directory: frontend
      - name: Verify same-origin static deployment in Chromium
        run: CLASHBOLT_BROWSER_MODE=static npm run test:e2e
        working-directory: frontend
      - name: Initialize native PostgreSQL for role-based browser coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER clashbolt WITH PASSWORD 'clashbolt'"
          sudo -u postgres psql -c "CREATE DATABASE clashbolt_browser OWNER clashbolt"
          VERSION="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          sudo pg_createcluster "$VERSION" clashbolt_browser_target -p 5433 --start
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'ci-target-only'"
          export CLASHBOLT_DATABASE_URL='postgresql://clashbolt:clashbolt@127.0.0.1:5432/clashbolt_browser'
          export CLASHBOLT_ACCESS_MODE=accounts
          export CLASHBOLT_SESSION_SECRET='ci-only-signed-session-secret-32-chars-123'
          python -m clashbolt.accounts migrate
          python - <<'PY'
          import os
          from clashbolt.accounts import AccountStore
          store = AccountStore(os.environ['CLASHBOLT_DATABASE_URL'])
          for username, role in (
              ('browser.operator', 'operator'),
              ('browser.second', 'operator'),
              ('browser.reviewer', 'reviewer'),
              ('browser.viewer', 'viewer'),
              ('browser.rolesync', 'operator'),
          ):
              store.create_account(username, role, 'browser-local-password-000')
          store.create_project('browser-workspace')
          store.grant_project_role('browser.operator', 'operator', 'browser-workspace')
          store.grant_project_role('browser.reviewer', 'reviewer', 'browser-workspace')
          store.grant_project_role('browser.viewer', 'viewer', 'browser-workspace')
          PY
          echo "CLASHBOLT_DATABASE_URL=$CLASHBOLT_DATABASE_URL" >> "$GITHUB_ENV"
          echo "CLASHBOLT_ACCESS_MODE=$CLASHBOLT_ACCESS_MODE" >> "$GITHUB_ENV"
          echo "CLASHBOLT_SESSION_SECRET=$CLASHBOLT_SESSION_SECRET" >> "$GITHUB_ENV"
          echo "CLASHBOLT_TARGET_CLUSTER_URL=postgresql://127.0.0.1:5433/postgres" >> "$GITHUB_ENV"
      - name: Start separate native worker
        run: |
          CLASHBOLT_TARGET_ADMIN_URL='postgresql://postgres:ci-target-only@127.0.0.1:5433/postgres' \
          nohup python -m clashbolt.worker --interval 0.1 \
            > /tmp/clashbolt-browser-worker.log 2>&1 &
      - name: Verify named roles and durable execution in Chromium
        working-directory: frontend
        run: |
          set -euo pipefail
          # Browser test accounts share a single CI loopback peer. Keep each
          # independent group below the production 20-login/minute throttle.
          # Backend tests verify the throttle is enforced, never disabled.
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/diagnostics.accounts.spec.ts \
            e2e/drafts.accounts.spec.ts \
            e2e/monotonic.accounts.spec.ts \
            e2e/projects.accounts.spec.ts
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["CLASHBOLT_DATABASE_URL"]) as conn:
              conn.execute("TRUNCATE account_login_throttle")
          PY
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/roles.accounts.spec.ts \
            e2e/rolesync.accounts.spec.ts \
            e2e/sse.accounts.spec.ts
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["CLASHBOLT_DATABASE_URL"]) as conn:
              conn.execute("TRUNCATE account_login_throttle")
          PY
          CLASHBOLT_BROWSER_MODE=accounts npx playwright test --workers=1 \
            e2e/reviews.accounts.spec.ts
      - name: Diagnose native worker if account browser verification fails
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          status = subprocess.run(
              ["pgrep", "-f", "^python -m clashbolt.worker --interval"],
              capture_output=True, text=True, check=False,
          )
          print("Worker process alive:", status.returncode == 0)
          logfile = Path("/tmp/clashbolt-browser-worker.log")
          if not logfile.is_file():
              print("No worker log file exists")
          else:
              # Only failure context, never print connection strings or tokens.
              lines = logfile.read_text(errors="replace").splitlines()
              for line in lines[-60:]:
                  clean = re.sub(r"postgres(?:ql)?://[^\\s]+", "[database-url]", line)
                  clean = re.sub(r"password=[^\\s]+", "password=[redacted]", clean)
                  print(clean[:500])
          PY


  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install deterministic adversarial fixture test dependencies
        run: python -m pip install -e '.[dev]' 'PyYAML>=6.0.2,<7'
      - name: Assert release and browser security policy cannot be bypassed
        run: python ci/check_ci_policy.py
      - name: Adversarial CI-gate mutation and synthetic target abuse regressions
        run: |
          python -m pytest -q --timeout=30 \
            ci/tests/test_gate_validation.py \
            ci/tests/test_deployment_security.py \
            backend/tests/test_adversarial_fixture.py \
            backend/tests/test_target_service_boundaries.py \
            backend/tests/test_fixture_runner_entrypoint.py \
            backend/tests/test_worker_security.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Resolve and audit Python runtime and test dependencies
        run: |
          python -m pip install -e '.[dev]' 'pip-audit>=2,<3'
          python -m pip check
          # Freeze the exact installed registry packages, including transitives.
          # The unpublished local editable ClashBolt distribution is not on PyPI.
          python -m pip freeze --exclude-editable > /tmp/clashbolt-pip-freeze.txt
          python -m pip_audit --strict --no-deps -r /tmp/clashbolt-pip-freeze.txt
      - name: Reject medium-or-higher confidence Python security findings
        run: bandit -r backend/clashbolt -ll -ii -q
      - name: Reject weakened systemd isolation and committed production credentials
        run: python ci/check_deployment_security.py
      - name: Audit frontend runtime and build dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install source on supported Python boundary
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m compileall -q backend/clashbolt
      - name: Require synthetic oracle, evidence and target protocol compatibility
        run: |
          python -m pytest -q --timeout=30 \
            backend/tests/test_experiment.py \
            backend/tests/test_witness.py \
            backend/tests/test_heldout.py \
            backend/tests/test_adversarial_fixture.py \
            backend/tests/test_target_service_boundaries.py \
            backend/tests/test_fixture_runner_entrypoint.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install release validation tooling
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          python -m pip check
      - name: Install locked frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Compile production React TypeScript assets
        working-directory: frontend
        run: npm run build
      - name: Build and validate release artifacts without publishing
        run: |
          set -euo pipefail
          mkdir -p release/dist
          python -m build --sdist --wheel --outdir release/dist
          python -m twine check --strict release/dist/*
          python ci/check_release_artifacts.py \
            release/dist/*.whl release/dist/*.tar.gz frontend/dist
          sha256sum release/dist/* > release/SHA256SUMS
      - name: Install wheel and source package from clean virtual environments
        run: |
          set -euo pipefail
          for kind in wheel source; do
            ROOT="$RUNNER_TEMP/clashbolt-$kind-smoke"
            python -m venv "$ROOT"
            if [[ "$kind" == "wheel" ]]; then
              "$ROOT/bin/python" -m pip install --no-cache-dir release/dist/*.whl
            else
              "$ROOT/bin/python" -m pip install --no-cache-dir release/dist/*.tar.gz
            fi
            "$ROOT/bin/python" -m pip check
            ( cd "$RUNNER_TEMP" && "$ROOT/bin/python" -I -c \
              "import importlib.metadata as m; import clashbolt.api; import clashbolt.worker; import clashbolt.target_service; import clashbolt.witness; assert m.version('clashbolt') == '0.2.0'" )
          done
      - name: Preserve checksum-identified candidate for review, not deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clashbolt-candidate-${{ github.sha }}
          path: |
            release/dist/*
            release/SHA256SUMS
            frontend/dist/**
          if-no-files-found: error
          retention-days: 7

  workflowlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Actions semantics and shell scripts with pinned linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml
          shellcheck -S error ci/check-target-service.sh

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [backend, frontend, browser, security, redteam, compatibility, package, workflowlint]
    steps:
      - name: Require all integration, security, red-team, packaging and cross-version jobs
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          SECURITY: ${{ needs.security.result }}
          REDTEAM: ${{ needs.redteam.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PACKAGE: ${{ needs.package.result }}
          WORKFLOWLINT: ${{ needs.workflowlint.result }}
        run: |
          set -euo pipefail
          for result in "$BACKEND" "$FRONTEND" "$BROWSER" "$SECURITY" "$REDTEAM" "$COMPATIBILITY" "$PACKAGE" "$WORKFLOWLINT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::ClashBolt release blocked: a required CI job returned $result"
              exit 1
            fi
          done
          echo "All required CI jobs passed for this commit."
